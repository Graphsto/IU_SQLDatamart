services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: buechertausch-db:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      LOAD_DUMMY_DATA: ${LOAD_DUMMY_DATA:-true}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d buechertausch"]
      interval: 5s
      retries: 12
volumes:
  pgdata: